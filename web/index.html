
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CELL MUSIC</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="app">

        <header class="top">
            <div class="logo">CELL <span>MUSIC</span></div>
            <div class="status">PLAYER OFFLINE</div>
        </header>

        <main>
            <section class="welcome">
                <p class="small-title">SEU UNIVERSO MUSICAL</p>
                <h1>O som começa aqui.</h1>
                <p class="description">
                    Uma nova experiência musical para o seu PlayStation 3.
                </p>
            </section>

            <section class="player">
                <div class="cover">
                    <span>♪</span>
                </div>

                <div class="track-info">
                    <h2>Nenhuma música</h2>
                    <p>Escolha uma música para começar</p>
                </div>

                <div class="controls">
                    <button type="button" id="previous">|◀</button>
                    <button type="button" id="play">▶</button>
                    <button type="button" id="next">▶|</button>
                </div>

                <div class="progress">
                    <div class="progress-line"></div>
                </div>
            </section>

            <section class="menu">
                <h2>Biblioteca</h2>
                <div class="menu-items">
                    <div class="menu-item selected">♫ Minha música</div>
                    <div class="menu-item">▣ Álbuns</div>
                    <div class="menu-item">◷ Recentes</div>
                    <div class="menu-item">⌕ Buscar</div>
                </div>
            </section>
        </main>

        <footer>
            CELL MUSIC — PROJETO EM DESENVOLVIMENTO
        </footer>

    </div>

    <script src="app.js"></script>
</body>
</html>
